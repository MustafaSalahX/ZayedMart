name: Build Zayed Mart Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APK (API 23+ Universal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Shared & Web Bundles
        run: npm run build

      - name: Sync Capacitor Android Assets
        working-directory: apps/web
        run: npx cap sync android

      - name: Build Universal Android APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK to Output
        run: |
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk zayed-mart-ops.apk

      - name: Upload Zayed Mart APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zayed-mart-ops-apk
          path: zayed-mart-ops.apk
          retention-days: 90
