<!doctype html>
<html lang="ar" dir="rtl" data-theme="minimal" data-mode="light" data-density="comfortable" data-glass="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="زايد مارت" />
    <title>زايد مارت — نظام التشغيل والمراقبة</title>
    <link rel="icon" type="image/png" sizes="512x512" href="/Logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function () {
        try {
          var META = {
            classic: ['#F8FAFD', '#131416'],
            minimal: ['#FFFFFF', '#09090B'],
            'liquid-glass': ['#DCEEFF', '#040B1A'],
            elegant: ['#FAF7F2', '#110E0C'],
            modern: ['#F6F7FA', '#0B0E14'],
          };
          var LEGACY = {
            nordic: 'minimal',
            'cyber-ops': 'modern',
            'desert-sand': 'elegant',
          };
          var html = document.documentElement;
          var explicitV2 = localStorage.getItem('zayed_theme_explicit_v2');
          var rawTheme = localStorage.getItem('zayed_theme_v1');
          var theme;
          if (explicitV2 !== '1') {
            if (!rawTheme || rawTheme === 'classic') {
              theme = 'minimal';
              try {
                localStorage.setItem('zayed_theme_v1', 'minimal');
              } catch (e) {}
            } else {
              var mappedTheme = LEGACY[rawTheme] || rawTheme;
              theme = META[mappedTheme] ? mappedTheme : 'minimal';
              try {
                localStorage.setItem('zayed_theme_v1', theme);
                localStorage.setItem('zayed_theme_explicit_v2', '1');
              } catch (e) {}
            }
          } else {
            var mapped = LEGACY[rawTheme] || rawTheme;
            theme = META[mapped] ? mapped : 'minimal';
            if (LEGACY[rawTheme]) {
              try {
                localStorage.setItem('zayed_theme_v1', theme);
              } catch (e) {}
            }
          }

          var modePref = localStorage.getItem('zayed_color_mode_v1');
          if (!modePref) {
            modePref = localStorage.getItem('zayed_dark_mode') === 'true' ? 'dark' : 'light';
          }
          var sysDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var mode =
            modePref === 'system'
              ? sysDark
                ? 'dark'
                : 'light'
              : modePref === 'dark'
              ? 'dark'
              : 'light';
          var isDark = mode === 'dark';

          var font = localStorage.getItem('zayed_font_family_v2') || 'auto';
          if (font === 'ibm-plex') font = 'ibm';
          if (['auto', 'cairo', 'ibm', 'tajawal', 'readex'].indexOf(font) === -1) font = 'auto';

          var scale = localStorage.getItem('zayed_font_scale') || 'scale-normal';
          if (['scale-normal', 'scale-large', 'scale-xlarge'].indexOf(scale) === -1) {
            scale = 'scale-normal';
          }

          var density = localStorage.getItem('zayed_density_v1') || 'comfortable';
          if (density !== 'compact' && density !== 'comfortable') density = 'comfortable';

          var glass = localStorage.getItem('zayed_glass_mode_v1') || 'auto';
          if (glass === 'full') glass = 'auto';
          if (['auto', 'reduced', 'off'].indexOf(glass) === -1) glass = 'auto';

          var liteSaved = localStorage.getItem('zayed_mart_lite_mode_v1');
          var isAndroid = /Android/i.test(navigator.userAgent || '');
          var lite =
            liteSaved === 'true'
              ? true
              : liteSaved === 'false'
              ? false
              : Boolean(
                  (navigator.deviceMemory && navigator.deviceMemory <= 2) ||
                    (isAndroid && navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4)
                );

          html.dataset.theme = theme;
          html.dataset.mode = mode;
          html.dataset.font = font;
          html.dataset.density = density;
          html.dataset.glass = glass;
          html.classList.toggle('dark', isDark);
          html.classList.toggle('dark-theme', isDark);
          html.classList.remove('scale-normal', 'scale-large', 'scale-xlarge');
          html.classList.add(scale);
          html.classList.toggle('lite-mode', lite);
          html.style.colorScheme = mode;

          var metaColor = (META[theme] || META.minimal)[isDark ? 1 : 0];
          var metaEl = document.querySelector('meta[name="theme-color"]');
          if (metaEl) metaEl.setAttribute('content', metaColor);
          if (window.ZayedAndroidBridge && window.ZayedAndroidBridge.setSystemBars) {
            var isLightBar = !isDark;
            window.ZayedAndroidBridge.setSystemBars(metaColor, isLightBar);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
